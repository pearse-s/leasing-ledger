<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ledger push spike</title>
<meta name="theme-color" content="#15110D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Push spike">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Same posture as the live page's CSP, narrower: this page loads only its own files and calls no API. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<style>
  :root { --bg:#15110D; --card:#211b15; --ink:#f3ece2; --muted:#b5a896; --gold:#E8B43E; --ok:#7bc47f; --bad:#e8796b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif;
         padding:max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 2px; }
  h2 { font-size:15px; margin:0 0 8px; color:var(--gold); }
  .sub { color:var(--muted); margin:0 0 14px; }
  section { background:var(--card); border-radius:12px; padding:14px; margin:0 0 12px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0; }
  dt { color:var(--muted); }
  dd { margin:0; overflow-wrap:anywhere; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:10px 14px; margin:4px 6px 4px 0;
           background:var(--gold); color:#15110D; }
  button.ghost { background:transparent; color:var(--gold); border:1px solid var(--gold); }
  button:disabled { opacity:.45; }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#0d0a08; border-radius:8px; padding:10px; font-size:12px; margin:8px 0 0; }
  #qr { background:#fff; border-radius:8px; padding:8px; margin-top:10px; display:none; }
  #qr svg { width:100%; height:auto; display:block; }
  .msg { color:var(--muted); margin:6px 0 0; min-height:1.2em; }
</style>
</head>
<body>
<main>
  <h1>Ledger push spike</h1>
  <p class="sub">Rebuild spike 4 · tests install, Web Push and storage on this phone. Sends nothing anywhere by itself.</p>

  <section>
    <h2>1 · This device</h2>
    <dl id="env"></dl>
    <p class="msg" id="install-hint"></p>
  </section>

  <section>
    <h2>2 · Push</h2>
    <button type="button" id="btn-enable">Enable push</button>
    <button type="button" class="ghost" id="btn-local">Local test notification</button>
    <button type="button" class="ghost" id="btn-unsub">Unsubscribe</button>
    <p class="msg" id="push-msg"></p>
    <div id="sub-box" hidden>
      <pre id="sub-json"></pre>
      <button type="button" id="btn-copy">Copy</button>
      <div id="qr"></div>
    </div>
  </section>

  <section>
    <h2>3 · Storage (Safari tab vs installed app)</h2>
    <dl id="store"></dl>
    <button type="button" id="btn-mark">Write marker here</button>
    <button type="button" class="ghost" id="btn-clear">Clear markers</button>
    <p class="msg" id="store-msg"></p>
  </section>
</main>
<script src="qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
